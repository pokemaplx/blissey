# Host-specific settings (timezone, where config.toml / data / dragonite.log live on the host)
# come from a .env file next to this compose file (cp .env.example .env) or, on platforms like
# Coolify, from the environment variables of the application.
services:
  blissey:
    build: .
    image: blissey:latest
    container_name: blissey
    restart: unless-stopped
    # Without host networking the container joins the compose/Coolify network: set
    # [database] host and the Rotom/Dragonite api_host to the container names. Enable
    # network_mode: host to mirror a manual install (everything on 127.0.0.1).
    # network_mode: host
    # Timezone: the /etc/localtime mount below copies the host's zone. It must match the
    # database server (all buckets are computed from now()). To set it explicitly instead,
    # drop that mount and use:
    # environment:
    #   TZ: Europe/Lisbon
    volumes:
      # config.toml on the host
      - ${BLISSEY_CONFIG_PATH:-./config.toml}:/blissey/config.toml:ro
      # logs, temp files and daily backups
      - ${BLISSEY_DATA_PATH:-./data}:/blissey/data
      # Dragonite's log folder (dragonite.log + rotated dragonite-*.gz), read-only at the
      # default [dragonite] log_dir
      - ${DRAGONITE_LOGS:-/opt/dragonite/logs}:/dragonite/logs:ro
      - /etc/localtime:/etc/localtime:ro
